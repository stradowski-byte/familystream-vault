name: Deploy FamilyStream Vault to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with pre-built production PWA (docs/)
        uses: actions/checkout@v4

      - name: Verify pre-built PWA bundle (404.html & .nojekyll)
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "Brak pliku docs/index.html!"
            exit 1
          fi
          cp docs/index.html docs/404.html
          touch docs/.nojekyll

      - name: Publish pre-built docs/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'chore(gh-pages): deploy FamilyStream Vault PWA'

      - name: Activate GitHub Pages on gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### FamilyStream Vault — GitHub Pages Deployment" >> $GITHUB_STEP_SUMMARY
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" 2>/dev/null || \
            gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" 2>/dev/null; then
            echo "- Status: **Aktywne na gałęzi \`gh-pages\`**" >> $GITHUB_STEP_SUMMARY
            echo "- Adres PWA: https://stradowski-byte.github.io/familystream-vault/" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Gałąź \`gh-pages\` została opublikowana." >> $GITHUB_STEP_SUMMARY
            echo "- Sprawdź adres: https://stradowski-byte.github.io/familystream-vault/" >> $GITHUB_STEP_SUMMARY
          fi
